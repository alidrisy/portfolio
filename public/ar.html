<!DOCTYPE html>

    <!-- SEO Meta Tags with Expanded Descriptions -->
    <meta
      name="description"
      content="مرحبًا بكم في الملف الشخصي الرسمي والمدونة المهنية لعبد الرحمن أديب محمد صالح الإدريسي، مهندس برمجيات متخصص في تطوير الويب باستخدام تقنيات حديثة مثل React و Node.js و JavaScript و TypeScript و Mongoose. استكشف مجموعة مهاراته المتنوعة في إدارة قواعد البيانات، تطوير تطبيقات الويب والموبايل، التواصل الفوري باستخدام Socket.IO، وتقنيات التعامل مع الأخطاء المتطورة. يقدم عبد الرحمن في ملفه الشخصي مجموعة من المشاريع المبتكرة والرؤى المهنية التي تعكس تطور مسيرته في مجال تطوير البرمجيات والهندسة السحابية."
    />
    <meta
      name="keywords"
      content="عبد الرحمن الادريسي, عبد الرحمن أديب, مهندس برمجيات, تطوير ويب, تطوير تطبيقات, ملف شخصي, برمجة, تطوير موبايل, React, Node.js, JavaScript, TypeScript, Mongoose, التواصل الفوري, Socket.IO, إدارة قواعد البيانات, البرمجة السحابية, التعامل مع الأخطاء, البرمجة, تطوير تطبيقات الويب, Flutter, React Native"

    />

      property="og:title"

    />
    <meta property="og:image" content="https://alidrisy.software/avatar.png" />
