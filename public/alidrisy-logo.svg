<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Alidrisy icon" width="512" height="512">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;display=swap');
            .icon-text { 
                fill: url(#iconGradient);
                font-family: "Orbitron", sans-serif; 
                font-weight: 900;
                letter-spacing: -0.02em;
                text-anchor: middle;
                dominant-baseline: middle;
            }
        </style>
        <!-- Enhanced gradient with more depth -->
        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e8d5bf" stop-opacity="1" />
            <stop offset="50%" stop-color="#d4c4b0" stop-opacity="1" />
            <stop offset="100%" stop-color="#c9b8a3" stop-opacity="1" />
        </linearGradient>
        
        <!-- Subtle background gradient -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a1816" stop-opacity="1" />
            <stop offset="100%" stop-color="#0f0e0d" stop-opacity="1" />
        </linearGradient>
        
        <!-- Shadow filter for depth -->
        <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="2" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- Subtle inner shadow on background -->
        <filter id="innerShadow">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
            <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
            <feFlood flood-color="#000000" flood-opacity="0.3" result="offsetColor"/>
            <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetBlur"/>
            <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Background with gradient and rounded corners -->
    <rect width="512" height="512" fill="url(#bgGradient)" rx="80" />
    
    <!-- Subtle accent border -->
    <rect width="512" height="512" fill="none" stroke="url(#iconGradient)" stroke-width="2" rx="80" opacity="0.15"/>
    
    <!-- Main letter A with shadow -->
    <text class="icon-text" x="256" y="285" font-size="380" filter="url(#textShadow)">A</text>
</svg>
